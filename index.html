<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>מחשבון פורמולות והעשרות - שניידר</title>
    <style>
        :root {
            --primary: #3b82f6;
            --primary-dark: #1e3a8a;
            --text-main: #334155;
            --bg-pastel: #f8fafc;
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

        body { 
            font-family: 'Calibri', 'Segoe UI', system-ui, sans-serif; 
            background: linear-gradient(135deg, #f6f8fb 0%, #e2e8f0 100%);
            margin: 0; 
            padding: 10px; 
            direction: rtl; 
            color: var(--text-main); 
            padding-bottom: 120px;
        }

        .container { 
            max-width: 100%; width: 500px; margin: auto; 
            background: white; padding: 20px; border-radius: 24px; 
            box-shadow: 0 10px 30px rgba(0,0,0,0.08); 
            display: flex; flex-direction: column; 
        }
        
        .header { text-align: center; margin-bottom: 20px; }
        h1 { font-size: 1.4rem; margin: 0; color: #1e293b; font-weight: 800; letter-spacing: -0.5px; }
        
        /* --- נתוני מטופל --- */
        .patient-data { 
            background: linear-gradient(145deg, #f0f9ff, #e0f2fe);
            padding: 15px; border-radius: 20px; 
            border: 1px solid #bae6fd; 
            margin-bottom: 20px; 
            box-shadow: inset 0 2px 4px rgba(255,255,255,0.5);
        }
        .weight-row { margin-bottom: 15px; display: flex; justify-content: center; }
        
        .weight-field input { 
            background: linear-gradient(145deg, #fffbeb, #ffffff) !important;
            border: 2px solid #fcd34d !important; 
            color: var(--primary-dark) !important; font-size: 1.5rem !important; 
            padding: 10px !important; text-align: center; font-weight: 800;
            border-radius: 16px; width: 150px; max-width: 100%; font-family: 'Calibri', sans-serif;
            box-shadow: 0 4px 10px rgba(251, 191, 36, 0.15);
        }
        
        .input-group { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 12px; }
        .input-field label { display: block; font-size: 0.85rem; margin-bottom: 5px; color: #0284c7; font-weight: 700; text-align: center; }
        .input-field input { 
            width: 100%; padding: 12px; border-radius: 12px; border: 1px solid #cbd5e1; 
            font-size: 1.1rem; font-weight: 700; text-align: center; 
            background: #ffffff; color: #1e3a8a; font-family: 'Calibri', sans-serif;
        }
        
        .total-vol-display { 
            background: rgba(255,255,255,0.7); border-radius: 12px; padding: 10px;
            text-align: center; font-size: 1rem; color: #0c4a6e; font-weight: 600; 
            border: 1px dashed #7dd3fc; display: flex; flex-wrap: wrap; justify-content: center; align-items: center; gap: 5px;
        }
        .total-vol-display strong { font-size: 1.2rem; color: #0284c7; }
        .ml-kg-display { font-size: 1rem; color: #0369a1; font-weight: 800; }

        /* --- קטגוריות --- */
        .category-container {
            display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; margin-bottom: 10px;
        }
        .cat-btn {
            background: white; border: 1px solid #e2e8f0; color: #475569;
            padding: 10px 14px; border-radius: 20px; font-size: 0.95rem; font-weight: 700;
            cursor: pointer; transition: all 0.2s; box-shadow: 0 2px 5px rgba(0,0,0,0.03);
            flex-grow: 1; text-align: center;
        }
        .cat-btn.active {
            background: #3b82f6; color: white; border-color: #3b82f6; box-shadow: 0 4px 12px rgba(59, 130, 246, 0.3);
        }
        
        /* רשימת בחירה */
        .selection-list {
            display: none;
            background: #ffffff; border: 1px solid #e2e8f0; border-radius: 16px;
            max-height: 280px; overflow-y: auto; margin-bottom: 15px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.05);
            animation: slideDown 0.3s ease;
        }
        @keyframes slideDown { from { opacity: 0; transform: translateY(-10px); } to { opacity: 1; transform: translateY(0); } }
        
        .selection-list.show { display: block; }
        .list-item { 
            padding: 14px 15px; border-bottom: 1px solid #f1f5f9; 
            font-size: 1rem; font-weight: 600; color: #334155; cursor: pointer;
            display: flex; align-items: center; justify-content: space-between;
        }
        .list-item:last-child { border-bottom: none; }
        .list-item:active { background: #eff6ff; }
        
        .stock-indicator { width: 10px; height: 10px; border-radius: 50%; display: inline-block; margin-left: 8px; }
        .stock-green { background: #22c55e; box-shadow: 0 0 6px #22c55e; }
        .stock-yellow { background: #eab308; box-shadow: 0 0 6px #eab308; }
        .stock-red { background: #ef4444; box-shadow: 0 0 6px #ef4444; }

        /* --- כרטיס וטבלה --- */
        .card { display: none; border-radius: 20px; border: 1px solid #f1f5f9; background: #fff; overflow: hidden; margin-top: 5px; box-shadow: 0 8px 20px rgba(0,0,0,0.03); }
        
        /* כותרת הפורמולה הנבחרת */
        .selected-formula-title {
            background: #eff6ff;
            color: #1e3a8a;
            text-align: center;
            padding: 12px;
            font-size: 1.15rem;
            font-weight: 800;
            border-bottom: 1px solid #bfdbfe;
        }

        .info-header { background: #f8fafc; padding: 12px 15px; font-weight: 700; color: #475569; font-size: 0.9rem; border-bottom: 1px solid #e2e8f0; }
        
        table { width: 100%; border-collapse: collapse; table-layout: fixed; }
        th { padding: 10px 2px; font-size: 0.75rem; color: #64748b; border-bottom: 2px solid #f1f5f9; text-align: center; vertical-align: middle; background: #fff; line-height: 1.2; }
        td { padding: 12px 2px; text-align: center; vertical-align: middle; font-size: 1rem; font-weight: 700; border-bottom: 1px solid #fff; }
        
        /* שורות חסומות (X) */
        tr.disabled-row { background-color: #f8fafc; color: #94a3b8; }
        tr.disabled-row input { cursor: not-allowed; opacity: 0.3; }
        tr.disabled-row td { color: #cbd5e1; font-weight: 800; }
        tr.disabled-row .col-conc { color: #94a3b8; }

        .col-radio { width: 45px; } .col-conc { width: 65px; }
        tr.row-0 { background-color: #f0fdf4; } tr.row-1 { background-color: #fefce8; } tr.row-2 { background-color: #fff1f2; } 
        
        /* --- העשרות --- */
        .additives-section { background: #ffffff; padding: 10px 15px; }
        
        .additives-row { display: flex; border-bottom: 1px solid #f1f5f9; }
        .additives-row:last-child { border-bottom: none; }
        
        .additive-item { width: 50%; padding: 10px 5px; display: flex; flex-direction: column; justify-content: flex-start; }
        .additive-item:first-child { border-left: 1px solid #f8fafc; }
        .additive-item.full-width { width: 100%; border-left: none; }

        .additive-header { display: flex; align-items: center; cursor: pointer; margin-bottom: 5px; }
        .additive-header input[type="checkbox"] { width: 20px; height: 20px; margin-left: 8px; cursor: pointer; accent-color: #3b82f6; flex-shrink: 0; border-radius: 4px; }
        .additive-header label { font-size: 0.95rem; font-weight: 600; color: #334155; cursor: pointer; line-height: 1.1; }
        .additive-header label small { display: block; font-size: 0.7rem; color: #94a3b8; font-weight: 400; margin-top: 2px; }
        
        .additive-input-area { display: none; width: 100%; animation: fadeIn 0.3s; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

        .add-input input, .add-input select { 
            width: 100%; padding: 8px; border-radius: 10px; border: 1px solid #cbd5e1; 
            text-align: center; font-weight: 700; font-size: 1.05rem; background: #fbfcfe; height: 40px; font-family: 'Calibri', sans-serif;
        }

        /* --- סיכום צף --- */
        .sticky-results { 
            position: fixed; bottom: 0; left: 0; right: 0; 
            background: rgba(30, 41, 59, 0.95); backdrop-filter: blur(12px);
            padding: 15px 0 30px 0;
            border-top-left-radius: 28px; border-top-right-radius: 28px;
            box-shadow: 0 -10px 40px rgba(0,0,0,0.25); 
            z-index: 900; color: white;
            display: flex; justify-content: center; align-items: center;
            gap: 30px;
        }
        .res-col { display: flex; flex-direction: column; align-items: center; justify-content: center; min-width: 130px; }
        .res-item span { display: block; font-size: 0.9rem; opacity: 0.9; margin-bottom: 4px; letter-spacing: 0.5px; }
        .res-item strong { font-size: 1.8rem; color: #facc15; line-height: 1; font-weight: 800; text-shadow: 0 2px 4px rgba(0,0,0,0.2); }
        .res-item small { display: block; font-size: 0.95rem; color: #7dd3fc; font-weight: 600; margin-top: 6px; }
        .divider { width: 1px; height: 50px; background: rgba(255,255,255,0.15); }

        .footer { text-align: center; margin-top: 25px; font-size: 0.8rem; color: #94a3b8; padding-bottom: 10px; }
        
        input::-webkit-outer-spin-button, input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
        input[type=number] { -moz-appearance: textfield; }
    </style>
</head>

let selectedFormulaId = null;
const defaultLabels = ["13.5%", "15%", "18%"];

function filterCategory(cat, btn) {
    document.querySelectorAll('.cat-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');

    let list = document.getElementById('selectionList');
    list.innerHTML = '';
    
    let filtered = db.filter(item => {
        if(cat === 'כללי') return item.cat === 'כללי';
        if(cat === 'מיוחדות') return item.cat === 'מיוחדות';
        return item.cat === cat;
    });

    filtered.forEach(item => {
        const div = document.createElement('div');
        div.className = 'list-item';
        
        let stockHtml = '';
        if (item.id !== 'bm') {
            let colorClass = item.stock === 1 ? 'stock-green' : item.stock === 2 ? 'stock-yellow' : 'stock-red';
            stockHtml = `<span class="stock-indicator ${colorClass}"></span>`;
        }

        div.innerHTML = `<span>${item.name}</span>${stockHtml}`;
        div.onclick = () => {
            selectedFormulaId = item.id;
            list.classList.remove('show');
            resetAdditives();
            updateCard(item);
        };
        list.appendChild(div);
    });

    list.classList.add('show');
}

function resetAdditives() {
    document.querySelectorAll('.additives-section input[type="checkbox"]').forEach(el => {
        el.checked = false;
        let targetId = el.getAttribute('onchange').match(/'([^']+)'/)[1];
        document.getElementById(targetId).style.display = 'none';
    });
    document.querySelectorAll('.additives-section input[type="number"]').forEach(el => el.value = '');
    document.getElementById('ad_neo_p').value = 0;
}

function updateCard(f) {
    document.getElementById('c').style.display = 'block';
    document.getElementById('selected_formula_name').innerText = f.name;
    
    if(f.id === "bm") {
        document.getElementById('info_head').style.display = 'none';
        document.getElementById('conc_table').style.display = 'none';
        document.getElementById('row_neo').style.display = 'flex';
        calcVol(); 
    } else {
        document.getElementById('info_head').style.display = 'block';
        document.getElementById('w').innerText = f.w;
        document.getElementById('r').innerText = f.r;
        document.getElementById('conc_table').style.display = 'table';
        document.getElementById('row_neo').style.display = 'none';
        
        document.getElementById('res_kcal').innerText = '0.0';
        document.getElementById('res_pro').innerText = '0.0';
        document.getElementById('res_kcal_kg').innerText = '';
        document.getElementById('res_pro_kg').innerText = '';
        
        let radios = document.querySelectorAll('input[name="conc"]');
        radios.forEach(r => r.checked = false);
    }

    let b = "";
    let labels = f.l || defaultLabels;
    
    f.d.forEach((r, i) => {
        let isX = labels[i] === "X" || r[0] === 0;
        let rowClass = `row-${i} ${isX ? 'disabled-row' : ''}`;
        let radioHtml = isX ? `<input type="radio" disabled>` : `<input type="radio" name="conc" value="${i}" onclick="calcVol()">`;
        let valKcal = isX ? "X" : r[0];
        let valPro = isX ? "X" : r[1];
        let labelText = isX ? "X" : labels[i];
        
        b += `<tr class="${rowClass}"><td class="col-radio">${radioHtml}</td><td class="col-conc">${labelText}</td><td>${valKcal}</td><td>${valPro}</td></tr>`;
    });
    document.getElementById('b').innerHTML = b;
}

function toggleVis(id, cb) {
    document.getElementById(id).style.display = cb.checked ? 'block' : 'none';
    calcVol();
}

function calcVol() {
    let ml = parseFloat(document.getElementById('v_ml').value) || 0;
    let num = parseFloat(document.getElementById('v_num').value) || 0;
    let weight = parseFloat(document.getElementById('v_kg').value) || 0;
    let total_ml = ml * num;
    document.getElementById('res_total_ml').innerText = total_ml;

    if(weight > 0 && total_ml > 0) {
        document.getElementById('res_ml_kg').innerText = Math.round(total_ml / weight);
        document.getElementById('ml_kg_span').style.display = 'inline-flex';
    } else { document.getElementById('ml_kg_span').style.display = 'none'; }

    let neo_p = parseFloat(document.getElementById('ad_neo_p').value) || 0;
    let neo_k = (neo_p * total_ml / 100) * 5.13;
    let neo_pro = (neo_p * total_ml / 100) * 0.134;

    let b_p = document.getElementById('cb_baby').checked ? (parseFloat(document.getElementById('ad_baby').value) || 0) : 0;
    let b_k = (b_p * total_ml / 100) * 3.84;
    
    let c_p = document.getElementById('cb_corn').checked ? (parseFloat(document.getElementById('ad_corn').value) || 0) : 0;
    let c_k = (c_p * total_ml / 100) * 3.68;
    
    let r_p = document.getElementById('cb_rice').checked ? (parseFloat(document.getElementById('ad_rice').value) || 0) : 0;
    let r_k = (r_p * total_ml / 100) * 3.74;

    let dex_p = document.getElementById('cb_dex').checked ? (parseFloat(document.getElementById('ad_dex').value) || 0) : 0;
    let dex_k = (dex_p * total_ml / 100) * 3.75;

    let can_p = document.getElementById('cb_canola').checked ? (parseFloat(document.getElementById('ad_canola').value) || 0) : 0;
    let can_k = (can_p * total_ml / 100) * 9;
    
    let mct_p = document.getElementById('cb_mct').checked ? (parseFloat(document.getElementById('ad_mct').value) || 0) : 0;
    let mct_k = (mct_p * total_ml / 100) * 8.5;

    let base_k = 0, base_p = 0;
    if(selectedFormulaId) {
        let formula = db.find(x => x.id === selectedFormulaId);
        
        if (selectedFormulaId === 'bm') {
            base_k = (68 * total_ml) / 100;
            base_p = (1.0 * total_ml) / 100;
        } else {
            let sel = document.querySelector('input[name="conc"]:checked');
            if(sel){
                let r = formula.d[sel.value];
                base_k = (r[0] * total_ml) / 100; 
                base_p = (r[1] * total_ml) / 100;
            }
        }
    }
    
    let final_k = base_k + neo_k + b_k + c_k + r_k + dex_k + can_k + mct_k;
    let final_p = base_p + neo_pro;
    
    document.getElementById('res_kcal').innerText = final_k.toFixed(1);
    document.getElementById('res_pro').innerText = final_p.toFixed(1);

    if(weight > 0) {
        document.getElementById('res_kcal_kg').innerText = "(" + (final_k/weight).toFixed(1) + " קק\"ל/ק\"ג)";
        document.getElementById('res_pro_kg').innerText = "(" + (final_p/weight).toFixed(1) + " ג'/ק\"ג)";
    } else { 
        document.getElementById('res_kcal_kg').innerText = ""; 
        document.getElementById('res_pro_kg').innerText = ""; 
    }
}
</script>
